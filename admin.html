<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Clean Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --accent: #00d4ff;
            --accent-2: #a855f7;
            --accent-grad: linear-gradient(135deg, #00d4ff, #a855f7);
            --text: #ffffff;
            --text-muted: #8899aa;
            --glass: rgba(5, 5, 20, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #000 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            min-height: 100vh;
        }

        /* Aurora */
        .aurora { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .aurora-orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.16; }
        .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, #7b2ff7, transparent 70%); top: -200px; left: -100px; animation: driftA 18s ease-in-out infinite alternate; }
        .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #00d4ff, transparent 70%); bottom: -100px; right: -80px; animation: driftB 22s ease-in-out infinite alternate; }
        .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #ff6b9d, transparent 70%); top: 50%; left: 50%; opacity: 0.08; animation: driftC 28s ease-in-out infinite alternate; }
        @keyframes driftA { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(70px,50px) scale(1.1); } }
        @keyframes driftB { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-50px,-40px) scale(1.1); } }
        @keyframes driftC { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-60px,60px) scale(0.9); } }

        /* Layout */
        .container { max-width: 1300px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }

        /* Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0 2.5rem;
            animation: fadeDown 0.8s ease;
        }
        .header-left h1 {
            font-size: 2rem;
            font-weight: 800;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .header-left p { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; letter-spacing: 1px; }
        .header-right { display: flex; gap: 1rem; align-items: center; }

        @keyframes fadeDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
            padding: 8px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 30px;
        }
        .back-link:hover { color: #fff; border-color: rgba(0,212,255,0.4); }

        .btn-refresh {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 5px 20px rgba(0,212,255,0.2);
        }
        .btn-refresh:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,212,255,0.35); }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            transition: var(--transition);
            animation: fadeUp 0.6s ease both;
        }
        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .stat-card:hover {
            border-color: rgba(0,212,255,0.3);
            box-shadow: 0 0 30px rgba(0,212,255,0.08);
            transform: translateY(-4px);
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .stat-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .stat-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            animation: fadeUp 0.6s ease both;
        }
        .chart-card:nth-child(1) { animation-delay: 0.3s; }
        .chart-card:nth-child(2) { animation-delay: 0.4s; }

        .chart-card.full-width {
            grid-column: 1 / -1;
            animation-delay: 0.5s;
        }

        .chart-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            font-weight: 600;
        }

        .chart-container { position: relative; }

        /* Orders table */
        .orders-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 3rem;
            animation: fadeUp 0.6s ease 0.5s both;
        }

        .table-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .table-header h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-weight: 600; }

        .table-wrapper { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        th {
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9rem;
        }

        tr:hover td { background: rgba(0,212,255,0.03); }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge-min { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.25); }
        .badge-may { background: rgba(168,85,247,0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.25); }
        .badge-retiro { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.25); }
        .badge-dom { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }

        .loader {
            display: none;
            margin: 50px auto;
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top: 3px solid #00d4ff;
            border-right: 3px solid #a855f7;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>

<body>
    <div class="aurora" aria-hidden="true">
        <div class="aurora-orb orb-1"></div>
        <div class="aurora-orb orb-2"></div>
        <div class="aurora-orb orb-3"></div>
    </div>

    <div class="container">
        <div class="page-header">
            <div class="header-left">
                <h1>Panel de Control</h1>
                <p>Estadísticas y pedidos en tiempo real</p>
            </div>
            <div class="header-right">
                <a href="index.html" class="back-link">← Tienda</a>
                <button class="btn-refresh" onclick="fetchData()">↻ Actualizar</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-label">Total Pedidos</div>
                <div id="totalOrders" class="stat-value">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🛍️</div>
                <div class="stat-label">Ítems Vendidos</div>
                <div id="totalItems" class="stat-value">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-label">Ventas Hoy</div>
                <div id="salesToday" class="stat-value">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-label">% Mayorista</div>
                <div id="pctMayorista" class="stat-value">—</div>
                <div class="stat-sub">del total de pedidos</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">Pedidos últimos 7 días</div>
                <div class="chart-container" style="height: 220px;">
                    <canvas id="chartDias"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">Minorista vs Mayorista</div>
                <div class="chart-container" style="height: 220px;">
                    <canvas id="chartModo"></canvas>
                </div>
            </div>
            <div class="chart-card full-width">
                <div class="chart-title">Top 8 productos más pedidos</div>
                <div class="chart-container" style="height: 220px;">
                    <canvas id="chartProductos"></canvas>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="orders-container">
            <div class="table-header">
                <h2>Últimos Pedidos</h2>
            </div>
            <div id="loader" class="loader"></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Productos</th>
                            <th>Modo</th>
                            <th>Entrega</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyY2Ub2tDU1zbHcdbB-MZHCQyQnxH_CltyXIz0wSTELdDDo99baZ3IiNTQ8nLe-FyE/exec";

        const CHART_DEFAULTS = {
            color: '#8899aa',
            borderColor: 'rgba(255,255,255,0.05)',
            gridColor: 'rgba(255,255,255,0.06)',
        };

        let charts = {};

        Chart.defaults.color = CHART_DEFAULTS.color;
        Chart.defaults.font.family = 'Outfit';

        async function fetchData() {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            try {
                const response = await fetch(SCRIPT_URL + "?action=pedidos");
                const result = await response.json();

                if (result.status === "success") {
                    renderStats(result.data);
                    renderCharts(result.data);
                    renderTable(result.data);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error al cargar los datos. Revisá la URL del script.");
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderStats(data) {
            document.getElementById('totalOrders').innerText = data.length;

            const totalItems = data.reduce((acc, o) => acc + (parseInt(o.total_items) || 0), 0);
            document.getElementById('totalItems').innerText = totalItems;

            const todayStr = new Date().toDateString();
            const salesToday = data.filter(o => {
                const d = new Date(o.timestamp);
                return !isNaN(d) && d.toDateString() === todayStr;
            }).length;
            document.getElementById('salesToday').innerText = salesToday;

            const mayoristas = data.filter(o => (o.modo || '').includes('MAYORISTA')).length;
            const pct = data.length > 0 ? Math.round(mayoristas / data.length * 100) : 0;
            document.getElementById('pctMayorista').innerText = pct + '%';
        }

        function renderCharts(data) {
            // --- Chart 1: Pedidos por día (últimos 7 días) ---
            const last7 = [];
            const last7Labels = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dayStr = d.toDateString();
                last7Labels.push(d.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric' }));
                last7.push(data.filter(o => {
                    const od = new Date(o.timestamp);
                    return !isNaN(od) && od.toDateString() === dayStr;
                }).length);
            }

            if (charts.dias) charts.dias.destroy();
            charts.dias = new Chart(document.getElementById('chartDias'), {
                type: 'bar',
                data: {
                    labels: last7Labels,
                    datasets: [{
                        data: last7,
                        backgroundColor: last7.map((_, i) =>
                            `rgba(0, 212, 255, ${0.15 + (i / 6) * 0.45})`
                        ),
                        borderColor: last7.map((_, i) =>
                            `rgba(0, 212, 255, ${0.4 + (i / 6) * 0.6})`
                        ),
                        borderWidth: 1,
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: CHART_DEFAULTS.gridColor }, ticks: { stepSize: 1 }, border: { display: false } },
                        x: { grid: { display: false }, border: { display: false } }
                    }
                }
            });

            // --- Chart 2: Minorista vs Mayorista ---
            const minCount = data.filter(o => (o.modo || '').includes('MINORISTA')).length;
            const mayCount = data.filter(o => (o.modo || '').includes('MAYORISTA')).length;

            if (charts.modo) charts.modo.destroy();
            charts.modo = new Chart(document.getElementById('chartModo'), {
                type: 'doughnut',
                data: {
                    labels: ['Minorista', 'Mayorista'],
                    datasets: [{
                        data: [minCount, mayCount],
                        backgroundColor: ['rgba(0,212,255,0.25)', 'rgba(168,85,247,0.25)'],
                        borderColor: ['rgba(0,212,255,0.7)', 'rgba(168,85,247,0.7)'],
                        borderWidth: 2,
                        hoverOffset: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true } }
                    }
                }
            });

            // --- Chart 3: Top productos ---
            const productCounts = {};
            data.forEach(o => {
                const raw = o.productos || '';
                const matches = raw.matchAll(/([^,(]+)\s*\(x(\d+)\)/g);
                for (const m of matches) {
                    const name = m[1].trim();
                    const qty = parseInt(m[2]) || 1;
                    productCounts[name] = (productCounts[name] || 0) + qty;
                }
            });

            const sorted = Object.entries(productCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8);

            if (charts.productos) charts.productos.destroy();
            charts.productos = new Chart(document.getElementById('chartProductos'), {
                type: 'bar',
                data: {
                    labels: sorted.map(([name]) => name),
                    datasets: [{
                        data: sorted.map(([, qty]) => qty),
                        backgroundColor: 'rgba(168,85,247,0.2)',
                        borderColor: 'rgba(168,85,247,0.7)',
                        borderWidth: 1,
                        borderRadius: 6,
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: CHART_DEFAULTS.gridColor }, ticks: { stepSize: 1 }, border: { display: false } },
                        y: { grid: { display: false }, border: { display: false } }
                    }
                }
            });
        }

        function renderTable(data) {
            const body = document.getElementById('ordersBody');
            body.innerHTML = '';

            data.forEach(order => {
                const row = document.createElement('tr');
                const orderDate = new Date(order.timestamp);
                const dateDisplay = isNaN(orderDate) ? '—' : orderDate.toLocaleString('es-AR', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                });

                const modoClass = (order.modo || '').includes('MAYOR') ? 'badge-may' : 'badge-min';
                const entregaClass = (order.tipoentrega || '').toLowerCase().includes('domicilio') ? 'badge-dom' : 'badge-retiro';

                row.innerHTML = `
                    <td style="font-size: 0.8rem; color: var(--text-muted);">${dateDisplay}</td>
                    <td><code style="font-size: 0.8rem; color: var(--accent); opacity: 0.8">${order.numeropedido || '—'}</code></td>
                    <td>
                        <div style="font-weight: 600;">${order.clientenombre || 'Sin nombre'}</div>
                        <div style="font-size: 0.78rem; color: var(--text-muted);">${order.clientetelefono || ''}</div>
                    </td>
                    <td style="font-size: 0.82rem; max-width: 280px; color: var(--text-muted);">${order.productos || ''}</td>
                    <td><span class="badge ${modoClass}">${order.modo || ''}</span></td>
                    <td><span class="badge ${entregaClass}">${order.tipoentrega || ''}</span></td>
                `;
                body.appendChild(row);
            });

            if (data.length === 0) {
                body.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 3rem;">Sin pedidos aún</td></tr>';
            }
        }

        fetchData();
    </script>
</body>

</html>
