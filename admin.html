<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Clean Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --accent: #ffffff;
            --success: #10b981;
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --white: rgba(255, 255, 255, 0.1);
            --glass: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.2);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background: #000 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 2rem 0;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .orders-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 3rem;
        }

        .table-header {
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 1.2rem 2rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 1.2rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--white);
        }

        .btn-refresh {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-refresh:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .loader {
            display: none;
            margin: 50px auto;
            border: 4px solid var(--white);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="loginOverlay"
        style="position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(20px); z-index:9999; display:flex; align-items:center; justify-content:center; padding:2rem;">
        <div class="stat-card" style="max-width:350px; width:100%;">
            <h2 style="margin-bottom:1rem;">Admin Login</h2>
            <div id="loginError" style="color:#ef4444; font-size:0.8rem; margin-bottom:1rem; display:none;">PIN
                Incorrecto</div>
            <input type="password" id="loginPin" placeholder="••••" maxlength="4"
                style="text-align:center; font-size:2rem; letter-spacing:10px; width:100%; padding:15px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:15px; color:#fff; margin-bottom:1.5rem;">
            <button class="btn-refresh" style="width:100%;" onclick="attemptLogin()">INGRESAR</button>
        </div>
    </div>

    <div class="container">
        <a href="index.html" class="back-link">← Volver a la Tienda</a>
        <header>
            <h1>Panel Administrativo</h1>
            <p style="color:var(--text-muted)">Monitoreo de ventas y pedidos en tiempo real</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Pedidos</h3>
                <div class="value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>Ventas Hoy</h3>
                <div class="value" id="salesToday">$0</div>
            </div>
            <div class="stat-card">
                <h3>Items Vendidos</h3>
                <div class="value" id="totalItems">0</div>
            </div>
        </div>

        <div class="orders-container">
            <div class="table-header">
                <h2>Pedidos Recientes</h2>
                <button class="btn-refresh" onclick="fetchData()">Actualizar</button>
            </div>
            <div class="loader" id="loader"></div>
            <div class="table-wrapper">
                <table id="ordersTable">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Pedido</th>
                            <th>Cliente</th>
                            <th>Productos</th>
                            <th>Modo</th>
                            <th>Entrega</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Core Modules -->
    <script src="js/api.js"></script>
    <script>
        // Sincronizar URL con api.js (se usa automáticamente por GAS_API)
        let sessionToken = sessionStorage.getItem('adminToken');

        async function attemptLogin() {
            const pin = document.getElementById('loginPin').value;
            const error = document.getElementById('loginError');

            try {
                const d = await GAS_API.post({ action: 'login', pin: pin });
                sessionToken = d.token;
                sessionStorage.setItem('adminToken', sessionToken);
                document.getElementById('loginOverlay').style.display = 'none';
                fetchData();
            } catch (e) {
                error.style.display = 'block';
                error.innerText = e.message;
            }
        }

        if (sessionToken) {
            document.getElementById('loginOverlay').style.display = 'none';
            window.onload = fetchData;
        }

        async function fetchData() {
            if (!sessionToken) return;

            const loader = document.getElementById('loader');
            const table = document.getElementById('ordersTable');
            loader.style.display = 'block';
            table.style.opacity = '0.3';

            try {
                // Obtenemos los datos para la tabla y las estadísticas
                // En el backend, 'orders' devuelve toda la hoja de pedidos
                const orders = await GAS_API.get('orders', { token: sessionToken });

                if (orders && Array.isArray(orders)) {
                    processData(orders);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                if (error.message.includes("expirada") || error.message.includes("No Autorizado")) {
                    sessionStorage.removeItem('adminToken');
                    location.reload();
                }
            } finally {
                loader.style.display = 'none';
                table.style.opacity = '1';
            }
        }

        function processData(data) {
            // Eliminar encabezados si vienen en la respuesta (la primera fila)
            const rows = data.slice(1).reverse(); // Invertir para ver lo más nuevo primero

            // Stats básicas calculadas en el cliente (puedes mover esto al backend si prefieres)
            const today = new Date().toLocaleDateString();
            let totalVentasHoy = 0;
            let totalItems = 0;

            const body = document.getElementById('ordersBody');
            body.innerHTML = '';

            rows.forEach(row => {
                const [timestamp, id, cliente, tel, productos, modo, entrega, total, notas] = row;

                const orderDate = new Date(timestamp);
                if (orderDate.toLocaleDateString() === today) {
                    totalVentasHoy += Number(total) || 0;
                }

                const tableRow = document.createElement('tr');
                const dateDisplay = orderDate.toLocaleString('es-AR', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                });

                tableRow.innerHTML = `
                    <td><span style="opacity: 0.6; font-size: 0.8rem">${dateDisplay}</span></td>
                    <td><strong style="font-family: monospace;">${id || '-'}</strong></td>
                    <td>
                        <div style="font-weight: 600">${cliente || 'Sin nombre'}</div>
                        <div style="font-size: 0.8rem; opacity: 0.6">${tel || ''}</div>
                    </td>
                    <td style="font-size: 0.85rem; max-width: 300px;">${productos || ''}</td>
                    <td><span class="status-pill">${modo || ''}</span></td>
                    <td><span style="font-size: 0.8rem">${entrega || ''}</span></td>
                `;
                body.appendChild(tableRow);
            });

            document.getElementById('totalOrders').innerText = rows.length;
            document.getElementById('salesToday').innerText = `$${totalVentasHoy.toLocaleString('es-AR')}`;
            document.getElementById('totalItems').innerText = rows.length; // Estimación simple
        }
    </script>
</body>

</html>
